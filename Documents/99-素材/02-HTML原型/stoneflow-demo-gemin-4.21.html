<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>StoneFlow - Unified U-Shell MVP</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
		<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
			body {
				font-family:
					'Inter',
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					sans-serif;
			}

			/* 针对 U 型外壳的无边框连通感 */
			.u-shell-bg {
				background-color: #f4f4f5; /* zinc-100 */
			}
			.main-card {
				background: #ffffff;
				box-shadow:
					0 10px 25px -5px rgba(0, 0, 0, 0.05),
					0 8px 10px -6px rgba(0, 0, 0, 0.05);
				border: 1px solid #e4e4e7; /* zinc-200 */
			}

			/* 隐藏滚动条但保留功能 */
			.no-scrollbar::-webkit-scrollbar {
				display: none;
			}
			.no-scrollbar {
				-ms-overflow-style: none;
				scrollbar-width: none;
			}
		</style>
	</head>
	<body class="u-shell-bg h-screen overflow-hidden text-zinc-900 selection:bg-blue-100">
		<div id="root"></div>

		<script type="text/babel">
			const { useState } = React

			// 自定义 SVG 图标组件
			const IconBase = ({ children, size = 16, className = '', ...props }) => (
				<svg
					width={size}
					height={size}
					viewBox='0 0 24 24'
					fill='none'
					stroke='currentColor'
					strokeWidth='2'
					strokeLinecap='round'
					strokeLinejoin='round'
					className={className}
					{...props}
				>
					{children}
				</svg>
			)

			const Search = (p) => (
				<IconBase {...p}>
					<circle cx='11' cy='11' r='8' />
					<path d='m21 21-4.3-4.3' />
				</IconBase>
			)
			const Inbox = (p) => (
				<IconBase {...p}>
					<polyline points='22 12 16 12 14 15 10 15 8 12 2 12' />
					<path d='M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z' />
				</IconBase>
			)
			const Target = (p) => (
				<IconBase {...p}>
					<circle cx='12' cy='12' r='10' />
					<circle cx='12' cy='12' r='6' />
					<circle cx='12' cy='12' r='2' />
				</IconBase>
			)
			const Trash2 = (p) => (
				<IconBase {...p}>
					<path d='M3 6h18' />
					<path d='M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6' />
					<path d='M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2' />
					<line x1='10' x2='10' y1='11' y2='17' />
					<line x1='14' x2='14' y1='11' y2='17' />
				</IconBase>
			)
			const FolderOpen = (p) => (
				<IconBase {...p}>
					<path d='m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2' />
				</IconBase>
			)
			const Plus = (p) => (
				<IconBase {...p}>
					<line x1='12' x2='12' y1='5' y2='19' />
					<line x1='5' x2='19' y1='12' y2='12' />
				</IconBase>
			)
			const ChevronRight = (p) => (
				<IconBase {...p}>
					<path d='m9 18 6-6-6-6' />
				</IconBase>
			)
			const CheckCircle2 = (p) => (
				<IconBase {...p}>
					<path d='M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z' />
					<path d='m9 12 2 2 4-4' />
				</IconBase>
			)
			const Settings = (p) => (
				<IconBase {...p}>
					<path d='M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.17a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z' />
					<circle cx='12' cy='12' r='3' />
				</IconBase>
			)
			const X = (p) => (
				<IconBase {...p}>
					<line x1='18' x2='6' y1='6' y2='18' />
					<line x1='6' x2='18' y1='6' y2='18' />
				</IconBase>
			)
			const Paperclip = (p) => (
				<IconBase {...p}>
					<path d='M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48' />
				</IconBase>
			)

			// 模拟数据
			const SPACES = [
				{ id: 'work', name: '工作', icon: '💼' },
				{ id: 'study', name: '学习', icon: '🎓' },
				{ id: 'life', name: '生活', icon: '🏠' },
			]

			const PROJECTS = [
				{ id: 'p1', name: 'StoneFlow V1', color: 'bg-blue-500' },
				{ id: 'p2', name: '后端系统重构', color: 'bg-purple-500' },
				{ id: 'p3', name: '设计系统 U1', color: 'bg-pink-500' },
			]

			const TASKS = [
				{
					id: 1,
					title: '🎨 完成 StoneFlow UI 架构设计',
					priority: 'H',
					project: 'StoneFlow V1',
					status: 'todo',
					note: '参考 Linear 和 Raycast 的 U-Shell 布局，实现极致连通感。',
					created_at: '2026-04-20',
				},
				{
					id: 2,
					title: '🛠️ 实现 SQLite 数据持久化层',
					priority: 'H',
					project: '后端系统重构',
					status: 'todo',
					note: '使用 SeaORM 进行实体映射。',
					created_at: '2026-04-19',
				},
				{
					id: 3,
					title: '📝 编写 P2 产品蓝图文档',
					priority: 'M',
					project: 'StoneFlow V1',
					status: 'todo',
					note: '定义核心路径：捕获 -> 整理 -> 执行。',
					created_at: '2026-04-18',
				},
				{
					id: 4,
					title: '✨ 优化全局搜索反馈动效',
					priority: 'L',
					project: '设计系统 U1',
					status: 'done',
					note: '让 ⌘K 的唤起像丝绸一样顺滑。',
					created_at: '2026-04-17',
				},
			]

			function App() {
				const [activeSpace, setActiveSpace] = useState('work')
				const [activeNav, setActiveNav] = useState('focus')
				const [selectedTask, setSelectedTask] = useState(null)

				const handleTaskClick = (task) => {
					setSelectedTask(task)
				}

				const closeSheet = () => setSelectedTask(null)

				return (
					<div className='flex flex-col h-screen overflow-hidden'>
						{/* Header: 无边框 U 型顶栏 */}
						<header className='h-12 flex items-center px-4 shrink-0'>
							<div className='w-64 flex items-center gap-2'>
								<div className='w-6 h-6 bg-zinc-900 rounded-md flex items-center justify-center'>
									<div className='w-2.5 h-2.5 bg-white rotate-45'></div>
								</div>
								<span className='font-semibold text-sm tracking-tight'>StoneFlow</span>
							</div>

							{/* Search Bar: 居中命令栏 */}
							<div className='flex-1 flex justify-center'>
								<div className='w-[420px] h-8 bg-zinc-200/60 rounded-md flex items-center px-2.5 gap-2 border border-transparent focus-within:border-zinc-300 focus-within:bg-white transition-all group cursor-text'>
									<Search size={14} className='text-zinc-500 group-focus-within:text-zinc-900' />
									<span className='text-[13px] text-zinc-500 group-focus-within:hidden'>
										搜索或 ⌘K 唤起命令...
									</span>
									<input
										className='flex-1 bg-transparent border-none outline-none text-[13px] hidden group-focus-within:block'
										placeholder='输入命令或任务标题...'
									/>
									<div className='flex items-center gap-1 opacity-40'>
										<kbd className='text-[10px] font-sans border border-zinc-400 rounded px-1'>
											⌘
										</kbd>
										<kbd className='text-[10px] font-sans border border-zinc-400 rounded px-1'>
											K
										</kbd>
									</div>
								</div>
							</div>

							{/* 去掉头像通知，换成新建按钮 */}
							<div className='w-64 flex justify-end'>
								<button className='h-8 px-3 bg-zinc-900 text-white rounded-md text-[12px] font-semibold hover:bg-zinc-800 transition-all flex items-center gap-1.5 shadow-sm active:scale-95'>
									<Plus size={14} />
									<span>新建任务</span>
									<kbd className='ml-1 opacity-50 text-[10px] font-normal'>N</kbd>
								</button>
							</div>
						</header>

						{/* Main Content Area */}
						<div className='flex flex-1 overflow-hidden'>
							{/* Sidebar: 连通外壳 */}
							<aside className='w-64 flex flex-col px-3 py-2 shrink-0'>
								{/* Space Tabs */}
								<div className='flex p-1 bg-zinc-200/50 rounded-lg mb-6'>
									{SPACES.map((space) => (
										<button
											key={space.id}
											onClick={() => setActiveSpace(space.id)}
											className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-md text-[12px] font-medium transition-all ${activeSpace === space.id ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}
										>
											<span>{space.icon}</span>
											{space.name}
										</button>
									))}
								</div>

								<nav className='space-y-0.5 mb-8'>
									<NavItem
										active={activeNav === 'inbox'}
										onClick={() => setActiveNav('inbox')}
										icon={<Inbox size={16} />}
										label='Inbox'
										count={3}
									/>
									<NavItem
										active={activeNav === 'focus'}
										onClick={() => setActiveNav('focus')}
										icon={<Target size={16} />}
										label='Focus'
									/>
									<NavItem
										active={activeNav === 'trash'}
										onClick={() => setActiveNav('trash')}
										icon={<Trash2 size={16} />}
										label='Trash'
									/>
								</nav>

								<div className='flex-1 overflow-y-auto no-scrollbar'>
									<div className='flex items-center justify-between px-2 mb-2'>
										<span className='text-[11px] font-semibold text-zinc-400 uppercase tracking-wider'>
											Projects
										</span>
										<button className='text-zinc-400 hover:text-zinc-900'>
											<Plus size={14} />
										</button>
									</div>
									<div className='space-y-0.5'>
										{PROJECTS.map((p) => (
											<NavItem
												key={p.id}
												icon={<div className={`w-2 h-2 rounded-full ${p.color}`} />}
												label={p.name}
											/>
										))}
									</div>
								</div>

								<nav className='mt-auto py-2'>
									<NavItem icon={<Settings size={16} />} label='Settings' />
								</nav>
							</aside>

							{/* Main Content Card */}
							<main className='flex-1 relative p-4 flex flex-col min-w-0'>
								<div className='main-card flex-1 rounded-2xl flex flex-col overflow-hidden relative'>
									{/* Card Internal Content */}
									<div className='h-14 border-b border-zinc-100 flex items-center px-6 shrink-0'>
										<h2 className='text-base font-semibold'>
											{activeNav.charAt(0).toUpperCase() + activeNav.slice(1)}
										</h2>
										<span className='ml-3 text-zinc-400 text-xs px-2 py-0.5 bg-zinc-100 rounded-full font-medium'>
											12
										</span>
									</div>

									<div className='flex-1 overflow-y-auto p-4 no-scrollbar'>
										<div className='max-w-4xl mx-auto space-y-1'>
											<div className='px-2 py-2 text-[11px] font-medium text-zinc-400 uppercase tracking-widest flex items-center gap-2'>
												<ChevronRight size={12} /> Todo
											</div>
											{TASKS.filter((t) => t.status === 'todo').map((task) => (
												<TaskRow
													key={task.id}
													task={task}
													isActive={selectedTask?.id === task.id}
													onClick={() => handleTaskClick(task)}
												/>
											))}
										</div>
									</div>

									{/* Task Detail Sheet: 属于 MainCard 的内部面板 */}
									<div
										className={`absolute inset-y-0 right-0 w-[420px] bg-white border-l border-zinc-100 shadow-[-10px_0_30px_-15px_rgba(0,0,0,0.1)] transition-transform duration-300 ease-emphasis z-10 ${selectedTask ? 'translate-x-0' : 'translate-x-full'}`}
									>
										{selectedTask && (
											<div className='flex flex-col h-full'>
												<div className='h-14 flex items-center justify-between px-6 border-b border-zinc-50 shrink-0'>
													<div className='flex items-center gap-2'>
														<span className='text-[11px] text-zinc-400 font-medium'>
															TASK-{selectedTask.id}
														</span>
													</div>
													<button
														onClick={closeSheet}
														className='p-1.5 text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 rounded-md transition-colors'
													>
														<IconBase size={18}>
															<line x1='18' y1='6' x2='6' y2='18'></line>
															<line x1='6' y1='6' x2='18' y2='18'></line>
														</IconBase>
													</button>
												</div>

												<div className='flex-1 overflow-y-auto p-6 space-y-8 no-scrollbar'>
													{/* Task Title Area */}
													<div className='space-y-2'>
														<div className='flex items-center gap-2 mb-1'>
															<div className={`w-3 h-3 rounded-full border border-zinc-300`}></div>
															<span className='text-xs text-zinc-500 font-medium uppercase tracking-tight'>
																Todo
															</span>
														</div>
														<h3 className='text-xl font-semibold leading-tight'>
															{selectedTask.title}
														</h3>
													</div>

													{/* Metadata Grid */}
													<div className='grid grid-cols-2 gap-y-6 gap-x-4'>
														<div className='space-y-1.5'>
															<span className='text-[11px] text-zinc-400 font-semibold uppercase tracking-wider'>
																优先级
															</span>
															<div className='flex items-center gap-2 px-2 py-1 bg-zinc-50 rounded border border-zinc-100 w-fit'>
																<div className='w-1.5 h-1.5 rounded-full bg-orange-500'></div>
																<span className='text-[13px] font-medium'>
																	{selectedTask.priority === 'H' ? 'High' : 'Medium'}
																</span>
															</div>
														</div>
														<div className='space-y-1.5'>
															<span className='text-[11px] text-zinc-400 font-semibold uppercase tracking-wider'>
																项目
															</span>
															<div className='flex items-center gap-2 px-2 py-1 bg-zinc-50 rounded border border-zinc-100 w-fit'>
																<FolderOpen size={12} className='text-zinc-400' />
																<span className='text-[13px] font-medium'>
																	{selectedTask.project}
																</span>
															</div>
														</div>
													</div>

													{/* Notes Area */}
													<div className='space-y-3'>
														<span className='text-[11px] text-zinc-400 font-semibold uppercase tracking-wider'>
															备注
														</span>
														<p className='text-[14px] text-zinc-600 leading-relaxed bg-zinc-50/50 p-4 rounded-xl border border-zinc-100/50 italic'>
															"{selectedTask.note}"
														</p>
													</div>

													{/* Resource Placeholder */}
													<div className='space-y-3'>
														<span className='text-[11px] text-zinc-400 font-semibold uppercase tracking-wider'>
															资源
														</span>
														<div className='space-y-2'>
															<div className='flex items-center justify-between p-3 border border-zinc-100 rounded-lg hover:border-zinc-200 cursor-pointer transition-colors group'>
																<div className='flex items-center gap-3'>
																	<Paperclip size={14} className='text-zinc-400' />
																	<span className='text-[13px] font-medium'>U1-设计系统.md</span>
																</div>
																<ChevronRight
																	size={14}
																	className='text-zinc-300 group-hover:text-zinc-500'
																/>
															</div>
														</div>
													</div>
												</div>

												<div className='h-12 border-t border-zinc-50 px-6 flex items-center justify-between text-[11px] text-zinc-400 shrink-0'>
													<span>创建于 {selectedTask.created_at}</span>
													<div className='flex items-center gap-2'>
														<button className='hover:text-zinc-900'>复制链接</button>
														<span className='opacity-30'>|</span>
														<button className='text-red-500/70 hover:text-red-500'>删除任务</button>
													</div>
												</div>
											</div>
										)}
									</div>
								</div>
							</main>
						</div>

						{/* Footer: 连通外壳 */}
						<footer className='h-8 flex items-center px-4 shrink-0 text-zinc-400 text-[11px]'>
							<div className='w-64 flex items-center gap-1.5'>
								<div className='w-2 h-2 rounded-full bg-emerald-500'></div>
								<span className='font-medium text-emerald-600/80'>SQLite Ready</span>
							</div>
							<div className='flex-1 flex justify-center gap-6'>
								<span>
									<kbd className='bg-zinc-200 px-1 rounded'>⌘</kbd>{' '}
									<kbd className='bg-zinc-200 px-1 rounded ml-0.5'>K</kbd> 命令面板
								</span>
								<span>
									<kbd className='bg-zinc-200 px-1 rounded'>N</kbd> 新建任务
								</span>
							</div>
							<div className='w-64 text-right'>StoneFlow V1.0.4 · local-first</div>
						</footer>
					</div>
				)
			}

			function NavItem({ icon, label, count, active, onClick }) {
				return (
					<button
						onClick={onClick}
						className={`w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-[13px] font-medium transition-all ${active ? 'bg-zinc-200 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900'}`}
					>
						<span className='shrink-0'>{icon}</span>
						<span className='flex-1 text-left truncate'>{label}</span>
						{count && (
							<span className='text-[11px] opacity-60 bg-zinc-300/50 px-1.5 py-0.5 rounded-md'>
								{count}
							</span>
						)}
					</button>
				)
			}

			function TaskRow({ task, onClick, isActive }) {
				const isDone = task.status === 'done'
				return (
					<div
						onClick={onClick}
						className={`group flex items-center gap-3 px-3 py-2.5 rounded-lg border transition-all cursor-pointer ${isActive ? 'bg-zinc-100 border-zinc-200' : 'border-transparent hover:border-zinc-200 hover:bg-zinc-50'} ${isDone ? 'opacity-50' : ''}`}
					>
						<div
							className={`shrink-0 w-4 h-4 rounded-full border flex items-center justify-center transition-all ${isDone ? 'bg-blue-500 border-blue-500' : 'border-zinc-300 group-hover:border-zinc-400'}`}
						>
							{isDone && <CheckCircle2 size={12} className='text-white' />}
						</div>
						<span
							className={`flex-1 text-[13px] font-medium truncate ${isDone ? 'line-through text-zinc-400' : 'text-zinc-800'}`}
						>
							{task.title}
						</span>

						<div className='flex items-center gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity'>
							<div
								className={`text-[10px] px-1.5 py-0.5 rounded border ${task.priority === 'H' ? 'text-orange-600 border-orange-200 bg-orange-50' : 'text-zinc-400 border-zinc-200'}`}
							>
								{task.priority}
							</div>
							<div className='text-[11px] text-zinc-400 flex items-center gap-1 bg-white px-2 py-0.5 rounded border border-zinc-200 shadow-sm'>
								<FolderOpen size={10} />
								{task.project}
							</div>
						</div>
					</div>
				)
			}

			const root = ReactDOM.createRoot(document.getElementById('root'))
			root.render(<App />)
		</script>
	</body>
</html>

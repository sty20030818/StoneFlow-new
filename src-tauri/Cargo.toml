[workspace]
members = [
  "crates/runtime",
  "crates/sync",
  "crates/platform",
  "crates/domain",
  "crates/application",
  "crates/storage",
  "crates/test-support",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
dotenvy = "0.15"
log = "0.4"
# SeaORM 2.0 起 sea-bae 不再依赖已废弃的 proc-macro-error2
sea-orm = { version = "2.0.0", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# sqlx 0.9：runtime / tls 特性拆分
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "process"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[package]
name = "stoneflow"
description = "StoneFlow"
authors = ["StoneFish"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json.workspace = true
stoneflow-runtime = { path = "crates/runtime" }
tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true

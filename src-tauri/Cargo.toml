[workspace]
members = [
  "crates/runtime",
  "crates/platform",
  "crates/domain",
  "crates/usecase",
  "crates/storage",
  "crates/schema",
  "crates/testing",
  "crates/migration",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
log = "0.4"
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "process"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[package]
name = "stoneflow"
description = "StoneFlow"
authors = ["StoneFish"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
stoneflow-runtime = { path = "crates/runtime" }
tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-window-state.workspace = true
